name: launch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/**"
      - ".github/workflows/launch.yml"

permissions:
  contents: write

jobs:
  launch:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Launch on the Simulator
        run: bash scripts/launch.sh

      - name: Publish the shot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add run/screen.png run/result.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record the Simulator launch"
          git push
