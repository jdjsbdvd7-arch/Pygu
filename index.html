<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pygu</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #ececee; color: #1d1d1f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  button { font: inherit; color: inherit; }
  body { background-image: radial-gradient(#d7d7db 1px, transparent 1px); background-size: 18px 18px; }
  .stage { min-height: 100dvh; display: grid; place-items: center; padding: 1.5rem 1rem 2rem; }
  .row { display: flex; align-items: center; gap: 1.1rem; }
  .device { width: min(320px, 72vw); padding: 11px; border-radius: 46px; background: #111; box-shadow: 0 24px 60px rgb(0 0 0 / 18%), inset 0 0 0 2px #2a2a2a; }
  .screen { position: relative; border-radius: 36px; overflow: hidden; background: #000; }
  .screen img { width: 100%; height: auto; display: block; touch-action: none; }
  .idle { aspect-ratio: 390 / 844; display: grid; place-items: center; color: #8e8e93; }
  .press { position: absolute; width: 28px; height: 28px; margin: -14px 0 0 -14px; border-radius: 50%; background: rgb(0 0 0 / 18%); pointer-events: none; }
  .rail { display: grid; gap: 0.55rem; padding: 0.55rem; border-radius: 22px; background: #fff; box-shadow: 0 10px 30px rgb(0 0 0 / 8%); }
  .rail button, .spin { width: 48px; height: 48px; border: 0; border-radius: 14px; background: #fff; display: grid; place-items: center; }
  .rail button.on { background: #e8e8ed; }
  .rail button + button { box-shadow: inset 0 1px 0 #eee; }
  .spin { margin: 1rem auto 0; border-radius: 50%; background: #fff; box-shadow: 0 10px 30px rgb(0 0 0 / 8%); }
  .bar { position: fixed; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; padding: 0.8rem 1rem; font-size: 0.85rem; color: #6e6e73; }
  a { color: inherit; }
</style>
</head>
<body>
<div class="bar"><span id="status">Off</span><a href="https://github.com/jdjsbdvd7-arch/Pygu/actions/workflows/sim.yml">Start</a></div>
<main class="stage">
  <div>
    <div class="row">
      <div class="device">
        <div class="screen" id="screen">
          <img id="feed" alt="iPhone" style="display:none">
          <div class="idle" id="idle">No session</div>
        </div>
      </div>
      <div class="rail">
        <button type="button" id="home" aria-label="Home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="1.7"><path d="M4 11.5 12 4l8 7.5"/><path d="M7 10.5V20h10v-9.5"/></svg></button>
        <button type="button" id="shot" aria-label="Screenshot"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="1.7"><path d="M8 7h2l1.2-1.5h3.6L16 7h2a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"/><circle cx="12" cy="13" r="3.2"/></svg></button>
        <button type="button" id="keys" aria-label="Keyboard"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="1.7"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M12 10h.01M17 10h.01M7 14h10"/></svg></button>
        <button type="button" id="lock" aria-label="Lock"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="1.7"><rect x="6" y="11" width="12" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
      </div>
    </div>
    <button class="spin" type="button" id="rotate" aria-label="Rotate"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="1.7"><path d="M20 12a8 8 0 1 1-2.2-5.5"/><path d="M20 4v5h-5"/></svg></button>
  </div>
</main>
<script>
const SESSION = "https://raw.githubusercontent.com/jdjsbdvd7-arch/Pygu/main/run/session.json";
const screen = document.querySelector("#screen");
const feed = document.querySelector("#feed");
const idle = document.querySelector("#idle");
const statusEl = document.querySelector("#status");
let live = "";
let stroke = [];
let typing = false;
let lastUrl = "";

function showIdle(text) {
  live = "";
  feed.style.display = "none";
  idle.style.display = "grid";
  idle.textContent = text;
}

async function frame() {
  if (!live) return;
  try {
    const res = await fetch(live + "/frame?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) return;
    const blob = await res.blob();
    const next = URL.createObjectURL(blob);
    if (lastUrl) URL.revokeObjectURL(lastUrl);
    lastUrl = next;
    feed.src = next;
    feed.style.display = "block";
    idle.style.display = "none";
  } catch (err) {}
}

function point(event) {
  const rect = feed.getBoundingClientRect();
  return { x: (event.clientX - rect.left) / rect.width, y: (event.clientY - rect.top) / rect.height };
}
feed.addEventListener("pointerdown", (event) => {
  feed.setPointerCapture(event.pointerId);
  stroke = [point(event)];
  const rect = feed.getBoundingClientRect();
  const dot = document.createElement("span");
  dot.className = "press";
  dot.style.left = (event.clientX - rect.left) + "px";
  dot.style.top = (event.clientY - rect.top) + "px";
  screen.appendChild(dot);
  setTimeout(() => dot.remove(), 220);
});
feed.addEventListener("pointermove", (event) => {
  if (!stroke.length) return;
  const next = point(event);
  const last = stroke[stroke.length - 1];
  if (Math.hypot(next.x - last.x, next.y - last.y) > 0.012) stroke.push(next);
});
feed.addEventListener("pointerup", () => {
  const points = stroke;
  stroke = [];
  if (!live || !points.length) return;
  fetch(live + "/gesture", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ points })
  }).catch(() => { statusEl.textContent = "Tap missed"; });
});
function press(path) {
  if (!live) return;
  fetch(live + path, { method: "POST" });
}
document.querySelector("#home").addEventListener("click", () => press("/home"));
document.querySelector("#lock").addEventListener("click", () => press("/lock"));
document.querySelector("#rotate").addEventListener("click", () => press("/rotate"));
document.querySelector("#shot").addEventListener("click", () => {
  if (!feed.src) return;
  const link = document.createElement("a");
  link.href = feed.src;
  link.download = "screen.jpg";
  link.click();
});
document.querySelector("#keys").addEventListener("click", (event) => {
  typing = !typing;
  event.currentTarget.classList.toggle("on", typing);
});
window.addEventListener("keydown", (event) => {
  if (!typing || !live) return;
  const text = event.key === "Backspace" ? "\b" : event.key.length === 1 ? event.key : "";
  if (!text) return;
  event.preventDefault();
  fetch(live + "/type", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ text })
  });
});

async function poll() {
  try {
    const res = await fetch(SESSION + "?t=" + Date.now());
    if (!res.ok) { statusEl.textContent = "Off"; showIdle("No session"); return; }
    const body = await res.json();
    if (body.status === "live" && body.url) {
      statusEl.textContent = "Live";
      live = body.url.replace(/\/$/, "");
      idle.textContent = "Connecting";
    } else {
      statusEl.textContent = "Off";
      showIdle("No session");
    }
  } catch (err) {
    statusEl.textContent = "Off";
  }
}
poll();
setInterval(poll, 4000);
setInterval(frame, 280);
</script>
</body>
</html>
