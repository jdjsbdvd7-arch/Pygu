<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pygu</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
  html, body, img, #touch { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  img { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #touch { position: fixed; inset: 0; z-index: 2; touch-action: none; }
  .wait { position: fixed; inset: 0; z-index: 3; display: grid; place-items: center; color: #8e8e93; background: #000; font: 16px -apple-system, BlinkMacSystemFont, sans-serif; }
  .press { position: fixed; z-index: 4; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: rgb(255 255 255 / 35%); pointer-events: none; }
</style>
</head>
<body>
<img id="a" alt="">
<img id="b" alt="" style="visibility:hidden">
<div id="touch"></div>
<div class="wait" id="wait">Connecting</div>
<script>
const wait = document.querySelector("#wait");
const touch = document.querySelector("#touch");
let shown = document.querySelector("#a");
let next = document.querySelector("#b");
let urlShown = "";
let stroke = [];

function decode(img, url) {
  return new Promise((resolve, reject) => {
    img.onload = () => resolve();
    img.onerror = () => reject(new Error("decode"));
    img.src = url;
  });
}

async function pull() {
  try {
    const res = await fetch("/api/go?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("http");
    const url = URL.createObjectURL(await res.blob());
    await decode(next, url);
    next.style.visibility = "visible";
    shown.style.visibility = "hidden";
    if (urlShown) URL.revokeObjectURL(urlShown);
    urlShown = url;
    const previous = shown;
    shown = next;
    next = previous;
    wait.style.display = "none";
  } catch (err) {
    if (!urlShown) wait.style.display = "grid";
  }
  setTimeout(pull, 90);
}

function place(event) {
  const touch = (event.touches && event.touches[0]) || (event.changedTouches && event.changedTouches[0]);
  return touch || event;
}

function point(event) {
  const here = place(event);
  const rect = shown.getBoundingClientRect();
  const nw = shown.naturalWidth || rect.width;
  const nh = shown.naturalHeight || rect.height;
  const scale = Math.max(rect.width / nw, rect.height / nh);
  const width = nw * scale;
  const height = nh * scale;
  const left = rect.left + (rect.width - width) / 2;
  const top = rect.top + (rect.height - height) / 2;
  return {
    x: Math.min(1, Math.max(0, (here.clientX - left) / width)),
    y: Math.min(1, Math.max(0, (here.clientY - top) / height))
  };
}

function send(op, points) {
  const query = new URLSearchParams({ op: op, t: String(Date.now()) });
  if (points && points.length) {
    query.set("p", points.map((item) => item.x.toFixed(4) + "," + item.y.toFixed(4)).join(";"));
  }
  fetch("/api/go?" + query.toString(), { method: "GET", cache: "no-store" });
}

function down(event) {
  if (event.cancelable) event.preventDefault();
  stroke = [point(event)];
  const here = place(event);
  const dot = document.createElement("span");
  dot.className = "press";
  dot.style.left = here.clientX + "px";
  dot.style.top = here.clientY + "px";
  document.body.appendChild(dot);
  setTimeout(() => dot.remove(), 140);
}

function move(event) {
  if (!stroke.length) return;
  if (event.cancelable) event.preventDefault();
  const here = point(event);
  const last = stroke[stroke.length - 1];
  if (Math.hypot(here.x - last.x, here.y - last.y) > 0.008) stroke.push(here);
}

function up(event) {
  if (event && event.cancelable) event.preventDefault();
  const points = stroke;
  stroke = [];
  if (!points.length) return;
  const first = points[0];
  const last = points[points.length - 1];
  if (first.y > 0.84 && last.y < first.y - 0.12) {
    send("home");
    return;
  }
  send("gesture", points);
}

touch.addEventListener("contextmenu", (event) => event.preventDefault());
touch.addEventListener("touchstart", down, { passive: false });
touch.addEventListener("touchmove", move, { passive: false });
touch.addEventListener("touchend", up, { passive: false });
touch.addEventListener("pointerdown", (event) => {
  if (event.pointerType === "touch") return;
  down(event);
});
touch.addEventListener("pointermove", (event) => {
  if (event.pointerType === "touch") return;
  move(event);
});
touch.addEventListener("pointerup", (event) => {
  if (event.pointerType === "touch") return;
  up(event);
});

pull();
</script>
</body>
</html>
