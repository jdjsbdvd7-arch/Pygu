<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pygu</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    background: #101114;
    color: #ece7dc;
    font: 16px/1.4 "Segoe UI", sans-serif;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.85rem 1.1rem;
    border-bottom: 1px solid #2c313a;
    letter-spacing: 0.14em;
    font-size: 0.75rem;
  }
  a { color: #c9893a; }
  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(16rem, 22rem);
    gap: 1.5rem;
    align-items: center;
    justify-items: center;
    padding: 1.5rem;
  }
  img {
    width: min(320px, 86vw);
    border-radius: 1.6rem;
    background: #050506;
  }
  form { width: min(100%, 22rem); display: grid; gap: 0.75rem; }
  label { display: grid; gap: 0.35rem; color: #8d93a0; font-size: 0.8rem; }
  input {
    border: 1px solid #2c313a;
    border-radius: 0.7rem;
    background: #16181c;
    color: #ece7dc;
    font: inherit;
    padding: 0.7rem 0.8rem;
  }
  button {
    border: 0;
    border-radius: 0.7rem;
    background: #c9893a;
    color: #1a1208;
    font: inherit;
    font-weight: 650;
    padding: 0.75rem 1rem;
  }
  p, ul { margin: 0; color: #8d93a0; font-size: 0.85rem; }
  ul { padding: 0; list-style: none; }
  li { padding: 0.35rem 0; border-top: 1px solid #2c313a; }
  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <span>PYGU</span>
  <a href="https://github.com/jdjsbdvd7-arch/Pygu/actions">Actions</a>
</header>
<main>
  <img id="shot" alt="Simulator screen" src="https://raw.githubusercontent.com/jdjsbdvd7-arch/Pygu/main/run/screen.png">
  <form id="desk">
    <label>Screen text
      <input id="title" maxlength="24" value="Pygu" autocomplete="off">
    </label>
    <button type="submit">Launch</button>
    <p id="status">Loading runs</p>
    <ul id="runs"></ul>
  </form>
</main>
<script>
const RUNS = "https://api.github.com/repos/jdjsbdvd7-arch/Pygu/actions/runs?per_page=8";
const SHOT = "https://raw.githubusercontent.com/jdjsbdvd7-arch/Pygu/main/run/screen.png";
const title = document.querySelector("#title");
const status = document.querySelector("#status");
const runs = document.querySelector("#runs");
const shot = document.querySelector("#shot");

async function refresh() {
  const res = await fetch(RUNS, { headers: { accept: "application/vnd.github+json" } });
  if (!res.ok) { status.textContent = "Run list unavailable"; return; }
  const body = await res.json();
  const list = body.workflow_runs || [];
  const latest = list[0];
  status.textContent = latest
    ? "#" + latest.run_number + " " + latest.status + (latest.conclusion ? " · " + latest.conclusion : "")
    : "No runs";
  const done = list.find((run) => run.conclusion === "success");
  if (done) shot.src = SHOT + "?t=" + encodeURIComponent(done.updated_at);
  runs.innerHTML = list.map((run) =>
    "<li><a href=\"" + run.html_url + "\">#" + run.run_number + " " + (run.conclusion || run.status) + "</a></li>"
  ).join("");
}

document.querySelector("#desk").addEventListener("submit", (event) => {
  event.preventDefault();
  const text = title.value.trim() || "Pygu";
  const url = "https://github.com/jdjsbdvd7-arch/Pygu/actions/workflows/launch.yml";
  status.textContent = "Open Run workflow and set the title to " + text;
  window.open(url, "_blank", "noopener");
});

refresh();
setInterval(refresh, 12000);
</script>
</body>
</html>
