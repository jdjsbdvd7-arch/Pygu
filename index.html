<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pygu</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  img { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; touch-action: none; user-select: none; -webkit-user-select: none; }
  .wait { position: fixed; inset: 0; display: grid; place-items: center; color: #8e8e93; font: 16px -apple-system, BlinkMacSystemFont, sans-serif; background: #000; }
  .wait a { color: #8e8e93; }
  .press { position: fixed; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: rgb(255 255 255 / 35%); pointer-events: none; }
</style>
</head>
<body>
<img id="feed" alt="" referrerpolicy="no-referrer" style="visibility:hidden">
<div class="wait" id="wait">Connecting</div>
<script>
const SESSION = "https://raw.githubusercontent.com/jdjsbdvd7-arch/Pygu/main/run/session.json";
const feed = document.querySelector("#feed");
const wait = document.querySelector("#wait");
let live = "";
let stroke = [];
let busy = false;

function showWait(text) {
  wait.hidden = false;
  wait.textContent = text;
  feed.style.visibility = "hidden";
}

feed.onload = () => {
  if (!feed.src) return;
  feed.style.visibility = "visible";
  wait.hidden = true;
  busy = false;
  setTimeout(pull, 180);
};
feed.onerror = () => {
  busy = false;
  if (live) setTimeout(pull, 700);
};

function pull() {
  if (!live || busy) return;
  busy = true;
  feed.src = live + "/frame?t=" + Date.now();
}

function point(event) {
  return { x: event.clientX / window.innerWidth, y: event.clientY / window.innerHeight };
}

feed.addEventListener("pointerdown", (event) => {
  feed.setPointerCapture(event.pointerId);
  stroke = [point(event)];
  const dot = document.createElement("span");
  dot.className = "press";
  dot.style.left = event.clientX + "px";
  dot.style.top = event.clientY + "px";
  document.body.appendChild(dot);
  setTimeout(() => dot.remove(), 180);
});
feed.addEventListener("pointermove", (event) => {
  if (!stroke.length) return;
  const next = point(event);
  const last = stroke[stroke.length - 1];
  if (Math.hypot(next.x - last.x, next.y - last.y) > 0.012) stroke.push(next);
});
feed.addEventListener("pointerup", () => {
  const points = stroke;
  stroke = [];
  if (!live || !points.length) return;
  const first = points[0];
  const last = points[points.length - 1];
  if (first.y > 0.84 && last.y < first.y - 0.12) {
    fetch(live + "/home", { method: "POST" });
    return;
  }
  fetch(live + "/gesture", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ points })
  });
});

async function poll() {
  try {
    const res = await fetch(SESSION + "?t=" + Date.now());
    if (!res.ok) { live = ""; showWait("No session"); return; }
    const body = await res.json();
    if (body.status === "live" && body.url) {
      const next = body.url.replace(/\/$/, "");
      if (next !== live) {
        live = next;
        busy = false;
        pull();
      }
    } else {
      live = "";
      showWait("No session");
    }
  } catch (err) {
    if (!feed.src) showWait("No session");
  }
}
poll();
setInterval(poll, 4000);
</script>
</body>
</html>
