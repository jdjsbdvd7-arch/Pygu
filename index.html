<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pygu</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  img { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; touch-action: none; user-select: none; -webkit-user-select: none; }
  .wait { position: fixed; inset: 0; display: grid; place-items: center; color: #8e8e93; font: 16px -apple-system, BlinkMacSystemFont, sans-serif; background: #000; }
  .press { position: fixed; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: rgb(255 255 255 / 35%); pointer-events: none; }
</style>
</head>
<body>
<img id="feed" alt="">
<div class="wait" id="wait" hidden></div>
<script>
const feed = document.querySelector("#feed");
const wait = document.querySelector("#wait");
let stroke = [];
let busy = false;
let shown = false;

feed.onload = () => {
  if (!feed.getAttribute("src")) return;
  shown = true;
  wait.hidden = true;
  busy = false;
  setTimeout(pull, 120);
};
feed.onerror = () => {
  busy = false;
  if (!shown) {
    wait.hidden = false;
    wait.textContent = "Connecting";
  }
  setTimeout(pull, 400);
};

function pull() {
  if (busy) return;
  busy = true;
  feed.src = "/api/go?t=" + Date.now();
}

function point(event) {
  return { x: event.clientX / window.innerWidth, y: event.clientY / window.innerHeight };
}

feed.addEventListener("pointerdown", (event) => {
  feed.setPointerCapture(event.pointerId);
  stroke = [point(event)];
  const dot = document.createElement("span");
  dot.className = "press";
  dot.style.left = event.clientX + "px";
  dot.style.top = event.clientY + "px";
  document.body.appendChild(dot);
  setTimeout(() => dot.remove(), 160);
});
feed.addEventListener("pointermove", (event) => {
  if (!stroke.length) return;
  const next = point(event);
  const last = stroke[stroke.length - 1];
  if (Math.hypot(next.x - last.x, next.y - last.y) > 0.012) stroke.push(next);
});
feed.addEventListener("pointerup", () => {
  const points = stroke;
  stroke = [];
  if (!points.length) return;
  const first = points[0];
  const last = points[points.length - 1];
  if (first.y > 0.84 && last.y < first.y - 0.12) {
    fetch("/api/go?op=home", { method: "POST" });
    return;
  }
  fetch("/api/go?op=gesture", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ points })
  });
});

pull();
</script>
</body>
</html>
