<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pygu</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
  html, body, img, #touch { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  img { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  #touch { position: fixed; inset: 0; z-index: 2; touch-action: none; }
  .boot {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: grid;
    place-items: center;
    background: #000;
    transition: opacity .6s ease;
  }
  .boot.hide { opacity: 0; pointer-events: none; }
  .apple {
    width: 64px;
    height: 78px;
    display: block;
    animation: ignition 1.4s ease-out both;
  }
  @keyframes ignition {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .bootcol { display: grid; justify-items: center; }
  .bootbar {
    width: 132px;
    height: 3px;
    margin-top: 36px;
    border-radius: 2px;
    background: #1c1c1e;
    overflow: hidden;
  }
  .bootbar i {
    display: block;
    height: 100%;
    width: 36%;
    background: #f5f5f7;
    border-radius: 2px;
    animation: bootslide 1.6s ease-in-out infinite;
  }
  @keyframes bootslide {
    0% { transform: translateX(-130%); }
    100% { transform: translateX(380%); }
  }
  #rail {
    position: fixed;
    z-index: 6;
    top: max(14px, env(safe-area-inset-top));
    left: max(10px, env(safe-area-inset-left));
    width: 46px;
    height: 18px;
    border: 0;
    border-radius: 9px;
    background: rgba(255,255,255,.22);
    box-shadow: inset 0 0 0 0.5px rgba(255,255,255,.45);
    backdrop-filter: blur(16px);
  }
  #menu {
    position: fixed;
    z-index: 6;
    top: calc(max(14px, env(safe-area-inset-top)) + 26px);
    left: max(10px, env(safe-area-inset-left));
    display: none;
    width: 148px;
    padding: 6px;
    border-radius: 16px;
    background: rgba(28,28,30,.72);
    box-shadow: 0 12px 40px rgba(0,0,0,.35);
    backdrop-filter: blur(22px);
  }
  #menu.open { display: grid; gap: 4px; }
  #menu button {
    height: 36px;
    border: 0;
    border-radius: 10px;
    background: rgba(255,255,255,.1);
    color: #fff;
    font: 600 14px/1 -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .press {
    position: fixed;
    z-index: 4;
    width: 64px;
    height: 64px;
    margin: -32px 0 0 -32px;
    border-radius: 50%;
    pointer-events: none;
    background: radial-gradient(circle, #fff 0%, rgba(255,255,255,.72) 28%, rgba(255,255,255,.18) 58%, rgba(255,255,255,0) 72%);
    box-shadow: 0 0 16px 4px rgba(255,255,255,.95), 0 0 42px 14px rgba(255,255,255,.45);
    animation: sway 460ms ease-out forwards;
  }
  @keyframes sway {
    0% { transform: scale(.25) rotate(-10deg); opacity: 1; }
    45% { transform: scale(1.05) rotate(7deg); opacity: 1; }
    100% { transform: scale(1.45) rotate(-4deg); opacity: 0; }
  }
</style>
</head>
<body>
<img id="a" alt="">
<img id="b" alt="" style="visibility:hidden">
<div id="touch"></div>
<div class="boot" id="boot">
  <div class="bootcol">
    <svg class="apple" viewBox="0 0 170 200" aria-hidden="true">
      <path fill="#f5f5f7" d="M138.1 105.6c-.3-24.2 19.8-35.8 20.7-36.4-11.3-16.5-28.8-18.8-35-19-14.9-1.5-29.1 8.8-36.6 8.8-7.6 0-19.2-8.6-31.6-8.3-16.2.2-31.2 9.4-39.6 24-16.9 29.3-4.3 72.6 12.1 96.4 8 11.6 17.6 24.6 30.2 24.1 12.1-.5 16.7-7.8 31.3-7.8s18.7 7.8 31.6 7.5c13-.2 21.2-11.8 29.1-23.5 9.2-13.4 13-26.4 13.2-27.1-.3-.1-25.3-9.7-25.6-38.5zM116.4 32.2c6.7-8.1 11.2-19.4 10-30.7-9.6.4-21.3 6.4-28.2 14.5-6.2 7.2-11.6 18.7-10.2 29.7 10.8.8 21.8-5.5 28.4-13.5z"/>
    </svg>
    <div class="bootbar"><i></i></div>
  </div>
</div>
<button id="rail" type="button" aria-label="Controls"></button>
<nav id="menu">
  <button type="button" data-act="home">Home</button>
  <button type="button" data-act="close">Close</button>
  <button type="button" data-act="switcher">Switcher</button>
  <button type="button" data-act="back">Back</button>
  <button type="button" data-act="top">Control</button>
  <button type="button" data-act="lock">Lock</button>
  <button type="button" data-act="rotate">Rotate</button>
</nav>
<script>
const boot = document.querySelector("#boot");
const touch = document.querySelector("#touch");
let shown = document.querySelector("#a");
let next = document.querySelector("#b");
let urlShown = "";
let stroke = [];
let live = "";

function decode(img, url) {
  return new Promise((resolve, reject) => {
    img.onload = () => resolve();
    img.onerror = () => reject(new Error("decode"));
    img.src = url;
  });
}

async function refresh() {
  try {
    const res = await fetch("https://raw.githubusercontent.com/jdjsbdvd7-arch/Pygu/main/run/session.json?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) return;
    const body = await res.json();
    if (body.status === "live" && body.url) live = String(body.url).replace(/\/$/, "");
  } catch (err) {}
}

let painting = false;
let pending = null;

function show(bytes) {
  const url = URL.createObjectURL(new Blob([bytes], { type: "image/jpeg" }));
  return decode(next, url).then(() => {
    next.style.visibility = "visible";
    shown.style.visibility = "hidden";
    if (urlShown) URL.revokeObjectURL(urlShown);
    urlShown = url;
    const previous = shown;
    shown = next;
    next = previous;
    boot.classList.add("hide");
  }).catch(() => {
    URL.revokeObjectURL(url);
  });
}

function paint(bytes) {
  pending = bytes;
  if (painting) return;
  painting = true;
  (async () => {
    while (pending) {
      const frame = pending;
      pending = null;
      await show(frame);
    }
    painting = false;
  })();
}

async function watch() {
  let reader = null;
  try {
    if (!live) await refresh();
    if (!live) throw new Error("wait");
    const res = await fetch("/api/live?via=" + encodeURIComponent(live), { cache: "no-store" });
    if (!res.ok || !res.body || !res.body.getReader) throw new Error("stream");
    reader = res.body.getReader();
    let buf = new Uint8Array(0);
    let saw = false;
    const slow = setTimeout(() => {
      if (!saw && reader) reader.cancel().catch(() => {});
    }, 2200);
    while (true) {
      const chunk = await reader.read();
      if (chunk.done) break;
      const merged = new Uint8Array(buf.length + chunk.value.length);
      merged.set(buf);
      merged.set(chunk.value, buf.length);
      buf = merged;
      while (buf.length >= 4) {
        const size = (buf[0] << 24) | (buf[1] << 16) | (buf[2] << 8) | buf[3];
        if (size < 80 || size > 1500000) {
          buf = buf.subarray(1);
          continue;
        }
        if (buf.length < 4 + size) break;
        const jpeg = buf.slice(4, 4 + size);
        buf = buf.subarray(4 + size);
        saw = true;
        clearTimeout(slow);
        paint(jpeg);
      }
    }
    clearTimeout(slow);
    if (!saw) throw new Error("empty");
  } catch (err) {
    if (!urlShown) {
      pull();
      return;
    }
  }
  setTimeout(watch, 60);
}

async function pull() {
  try {
    if (!live) await refresh();
    if (!live) throw new Error("wait");
    const res = await fetch("/api/go?via=" + encodeURIComponent(live) + "&t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("http");
    const url = URL.createObjectURL(await res.blob());
    await decode(next, url);
    next.style.visibility = "visible";
    shown.style.visibility = "hidden";
    if (urlShown) URL.revokeObjectURL(urlShown);
    urlShown = url;
    const previous = shown;
    shown = next;
    next = previous;
    boot.classList.add("hide");
  } catch (err) {
    if (!urlShown) boot.classList.remove("hide");
  }
  setTimeout(pull, urlShown ? 20 : 400);
}

function place(event) {
  const touch = (event.touches && event.touches[0]) || (event.changedTouches && event.changedTouches[0]);
  return touch || event;
}

function point(event) {
  const here = place(event);
  const rect = shown.getBoundingClientRect();
  const nw = shown.naturalWidth || rect.width;
  const nh = shown.naturalHeight || rect.height;
  const scale = Math.min(rect.width / nw, rect.height / nh);
  const width = nw * scale;
  const height = nh * scale;
  const left = rect.left + (rect.width - width) / 2;
  const top = rect.top + (rect.height - height) / 2;
  return {
    x: Math.min(1, Math.max(0, (here.clientX - left) / width)),
    y: Math.min(1, Math.max(0, (here.clientY - top) / height))
  };
}

function send(op, points) {
  if (!live) return;
  const query = new URLSearchParams({ op: op, t: String(Date.now()), via: live });
  if (points && points.length) {
    query.set("p", points.map((item) => item.x.toFixed(4) + "," + item.y.toFixed(4)).join(";"));
  }
  fetch("/api/go?" + query.toString(), { method: "GET", cache: "no-store" });
}

function down(event) {
  if (event.cancelable) event.preventDefault();
  stroke = [point(event)];
  const here = place(event);
  const dot = document.createElement("span");
  dot.className = "press";
  dot.style.left = here.clientX + "px";
  dot.style.top = here.clientY + "px";
  document.body.appendChild(dot);
  setTimeout(() => dot.remove(), 480);
}

function move(event) {
  if (!stroke.length) return;
  if (event.cancelable) event.preventDefault();
  const here = point(event);
  const last = stroke[stroke.length - 1];
  if (Math.hypot(here.x - last.x, here.y - last.y) > 0.008) stroke.push(here);
}

function up(event) {
  if (event && event.cancelable) event.preventDefault();
  const points = stroke;
  stroke = [];
  if (!points.length) return;
  const first = points[0];
  const last = points[points.length - 1];
  if (first.y > 0.84 && last.y < first.y - 0.12) {
    send("home");
    return;
  }
  send("gesture", points);
}

touch.addEventListener("contextmenu", (event) => event.preventDefault());
touch.addEventListener("touchstart", down, { passive: false });
touch.addEventListener("touchmove", move, { passive: false });
touch.addEventListener("touchend", up, { passive: false });
touch.addEventListener("pointerdown", (event) => {
  if (event.pointerType === "touch") return;
  down(event);
});
touch.addEventListener("pointermove", (event) => {
  if (event.pointerType === "touch") return;
  move(event);
});
touch.addEventListener("pointerup", (event) => {
  if (event.pointerType === "touch") return;
  up(event);
});

const menu = document.querySelector("#menu");
const rail = document.querySelector("#rail");

function act(name) {
  if (name === "home" || name === "close") send("home");
  else if (name === "lock") send("lock");
  else if (name === "rotate") send("rotate");
  else if (name === "back") send("gesture", [{ x: 0.02, y: 0.5 }, { x: 0.62, y: 0.5 }]);
  else if (name === "switcher") send("gesture", [{ x: 0.5, y: 0.99 }, { x: 0.5, y: 0.62 }]);
  else if (name === "top") send("gesture", [{ x: 0.86, y: 0.01 }, { x: 0.86, y: 0.42 }]);
  menu.classList.remove("open");
}

rail.addEventListener("pointerdown", (event) => {
  event.preventDefault();
  event.stopPropagation();
  menu.classList.toggle("open");
});
menu.addEventListener("pointerdown", (event) => {
  event.preventDefault();
  event.stopPropagation();
  const hit = event.target.closest("button");
  if (hit) act(hit.dataset.act);
});

watch();
</script>
</body>
</html>
